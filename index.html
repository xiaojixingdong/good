<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>旁白的生日祝福</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            touch-action: none;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-size: 20px;
            z-index: 100;
            transition: opacity 1s;
        }
        #letter-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            cursor: pointer;
            padding: 20px;
        }
        #letter-overlay.active { display: flex; }
        .letter-paper {
            width: 90vw;
            max-width: 500px;
            background: linear-gradient(135deg, #fffef5 0%, #fff8e7 100%);
            border-radius: 8px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .letter-paper.show {
            transform: scale(1);
            opacity: 1;
        }
        .letter-text {
            color: #333;
            font-size: 17px;
            line-height: 2;
            text-align: center;
        }
        .letter-text .line {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }
        .letter-text .line.show {
            opacity: 1;
            transform: translateY(0);
        }
        .letter-close {
            position: absolute;
            top: 12px; right: 18px;
            color: #999;
            font-size: 28px;
            cursor: pointer;
        }
        #hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,215,0,0.7);
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s;
            text-align: center;
            white-space: nowrap;
        }
        #progress {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
        }
        .progress-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.4);
            background: transparent;
            transition: all 0.5s;
        }
        .progress-dot.opened {
            background: #ffd700;
            border-color: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="loading">正在准备生日惊喜...</div>
    <div id="canvas-container"></div>
    <div id="progress">
        <div class="progress-dot" id="dot-0"></div>
        <div class="progress-dot" id="dot-1"></div>
        <div class="progress-dot" id="dot-2"></div>
    </div>
    <div id="hint">拖拽旋转视角 · 点击信封阅读</div>

    <div id="letter-overlay">
        <div class="letter-paper" id="letter-paper">
            <div class="letter-close">&times;</div>
            <div class="letter-text" id="letter-text"></div>
        </div>
    </div>

<script>
// ==================== 音频系统 ====================
class AudioSystem {
    constructor() {
        this.ctx = null;
        this.initialized = false;
    }
    init() {
        if (this.initialized) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.initialized = true;
    }
    playTone(freq, start, duration, vol) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(vol, start);
        gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
        osc.start(start);
        osc.stop(start + duration);
    }
    playBirthdaySong() {
        if (!this.ctx) this.init();
        const notes = [
            {f: 264, d: 0.4}, {f: 264, d: 0.4}, {f: 297, d: 0.8}, {f: 264, d: 0.8},
            {f: 352, d: 0.8}, {f: 330, d: 1.2}, {f: 264, d: 0.4}, {f: 264, d: 0.4},
            {f: 297, d: 0.8}, {f: 264, d: 0.8}, {f: 396, d: 0.8}, {f: 352, d: 1.2},
            {f: 264, d: 0.4}, {f: 264, d: 0.4}, {f: 528, d: 0.8}, {f: 440, d: 0.8},
            {f: 352, d: 0.8}, {f: 330, d: 0.8}, {f: 297, d: 1.2}
        ];
        let time = this.ctx.currentTime;
        notes.forEach(n => {
            this.playTone(n.f, time, n.d, 0.1);
            time += n.d;
        });
    }
    playOpen() {
        if (!this.ctx) this.init();
        const now = this.ctx.currentTime;
        this.playTone(523, now, 0.15, 0.08);
        this.playTone(659, now + 0.1, 0.2, 0.08);
        this.playTone(784, now + 0.25, 0.3, 0.06);
    }
    playLaunch() {
        if (!this.ctx) this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
        osc.type = 'sawtooth';
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    }
    playExplosion() {
        if (!this.ctx) this.init();
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.04));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const g = this.ctx.createGain();
        g.gain.value = 0.08;
        noise.connect(g);
        g.connect(this.ctx.destination);
        noise.start();
    }
}

const audio = new AudioSystem();

// ==================== Three.js 场景 ====================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000011, 0.001);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 8, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas-container').appendChild(renderer.domElement);

// 灯光
scene.add(new THREE.AmbientLight(0x1a1a3e, 0.6));
const moonLight = new THREE.DirectionalLight(0x6666ff, 0.4);
moonLight.position.set(50, 100, 50);
scene.add(moonLight);

// ==================== 星空 ====================
const starCount = 2000;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
    starPos[i * 3] = (Math.random() - 0.5) * 800;
    starPos[i * 3 + 1] = (Math.random() - 0.5) * 800;
    starPos[i * 3 + 2] = (Math.random() - 0.5) * 800;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));

const starMat = new THREE.ShaderMaterial({
    uniforms: {
        time: { value: 0 },
        color: { value: new THREE.Color(0xffffff) }
    },
    vertexShader: `
        varying float vAlpha;
        uniform float time;
        void main() {
            vAlpha = 0.5 + 0.5 * sin(time * 2.0 + position.x * 0.01);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = 2.0 * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        uniform vec3 color;
        varying float vAlpha;
        void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float alpha = (1.0 - dist * 2.0) * vAlpha;
            gl_FragColor = vec4(color, alpha);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ==================== 湖面 ====================
const lakeGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
const lakeMat = new THREE.MeshPhongMaterial({
    color: 0x0a0a2e,
    emissive: 0x050520,
    specular: 0x4444ff,
    shininess: 100,
    transparent: true,
    opacity: 0.9,
    side: THREE.DoubleSide
});
const lake = new THREE.Mesh(lakeGeo, lakeMat);
lake.rotation.x = -Math.PI / 2;
lake.position.y = -10;
scene.add(lake);

// ==================== 萤火虫 ====================
const fireflyCount = 60;
const fireflies = [];
for (let i = 0; i < fireflyCount; i++) {
    const geo = new THREE.SphereGeometry(0.08, 6, 6);
    const mat = new THREE.MeshBasicMaterial({
        color: 0xffff00,
        transparent: true,
        opacity: 0.8
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
        (Math.random() - 0.5) * 50,
        Math.random() * 15 - 3,
        (Math.random() - 0.5) * 50
    );
    mesh.userData = {
        vx: (Math.random() - 0.5) * 0.03,
        vy: (Math.random() - 0.5) * 0.02,
        vz: (Math.random() - 0.5) * 0.03,
        baseY: mesh.position.y,
        phase: Math.random() * Math.PI * 2
    };
    scene.add(mesh);
    fireflies.push(mesh);
}

// ==================== 信封创建 ====================
const envelopes = [];
const envelopeData = [
    {
        color: 0xc41e3a,
        position: new THREE.Vector3(-12, 0, 0),
        text: '旁白，生日快乐。谢谢你陪我玩MC，那些一起挖矿、建房子的时光，是我最好的游戏回忆。',
        opened: false
    },
    {
        color: 0x2e8b57,
        position: new THREE.Vector3(0, 2, -3),
        text: '这次不能去香港陪你过生日，真的很遗憾。但你要知道，距离再远，朋友的心是连在一起的。愿你新的一岁，想要的都能实现，快乐不止生日。',
        opened: false
    },
    {
        color: 0x4169e1,
        position: new THREE.Vector3(12, 0, 0),
        text: '等下次见面，咱们MC里建个更大的房子，或者联机打通所有模组。生日快乐，旁白。最好的朋友。',
        opened: false
    }
];

function createEnvelope(data, index) {
    const group = new THREE.Group();

    const bodyGeo = new THREE.BoxGeometry(3.5, 2.2, 0.2);
    const bodyMat = new THREE.MeshStandardMaterial({
        color: data.color,
        roughness: 0.5,
        metalness: 0.1
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    group.add(body);

    const flapShape = new THREE.Shape();
    flapShape.moveTo(-1.75, 0);
    flapShape.lineTo(1.75, 0);
    flapShape.lineTo(0, -1.1);
    flapShape.lineTo(-1.75, 0);
    const flapGeo = new THREE.ShapeGeometry(flapShape);
    const flapMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(data.color).multiplyScalar(0.85),
        roughness: 0.5,
        side: THREE.DoubleSide
    });
    const flap = new THREE.Mesh(flapGeo, flapMat);
    flap.position.set(0, 1.1, 0.11);
    group.add(flap);

    const ribbonH = new THREE.Mesh(
        new THREE.BoxGeometry(3.7, 0.12, 0.25),
        new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 })
    );
    ribbonH.position.y = 0.3;
    group.add(ribbonH);

    const ribbonV = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 2.4, 0.25),
        new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 })
    );
    group.add(ribbonV);

    const seal = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.25, 0.08, 16),
        new THREE.MeshStandardMaterial({ color: 0x8B0000, metalness: 0.5, roughness: 0.4 })
    );
    seal.rotation.x = Math.PI / 2;
    seal.position.set(0, 0.2, 0.13);
    group.add(seal);

    const glow = new THREE.Mesh(
        new THREE.SphereGeometry(2.5, 16, 16),
        new THREE.MeshBasicMaterial({
            color: data.color,
            transparent: true,
            opacity: 0.04,
            depthWrite: false
        })
    );
    group.add(glow);

    const light = new THREE.PointLight(data.color, 0.6, 12);
    light.position.set(0, 0, 2);
    group.add(light);

    group.position.copy(data.position);
    group.userData = { index, data, flap, glow, originalY: data.position.y };
    scene.add(group);
    envelopes.push(group);
    return group;
}

envelopeData.forEach((data, i) => createEnvelope(data, i));

// ==================== 真实烟花系统（上升+爆炸）====================
const rockets = [];
const explosions = [];

function launchRealFirework() {
    audio.playLaunch();

    const startX = (Math.random() - 0.5) * 30;
    const startZ = (Math.random() - 0.5) * 20;
    const targetY = 15 + Math.random() * 15;
    const color = [0xff0000, 0xffd700, 0x00ff00, 0x00bfff, 0xff69b4, 0xff8c00, 0xff1493, 0x7fff00][Math.floor(Math.random() * 8)];

    // 上升火箭
    const rocketGeo = new THREE.SphereGeometry(0.15, 8, 8);
    const rocketMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const rocket = new THREE.Mesh(rocketGeo, rocketMat);
    rocket.position.set(startX, -8, startZ);
    scene.add(rocket);

    // 尾迹粒子
    const trailParticles = [];

    rockets.push({
        mesh: rocket,
        trail: trailParticles,
        vx: (Math.random() - 0.5) * 0.05,
        vy: 0.3 + Math.random() * 0.1,
        vz: (Math.random() - 0.5) * 0.05,
        targetY: targetY,
        color: color,
        exploded: false
    });
}

function updateRockets() {
    for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];

        if (!r.exploded) {
            // 上升
            r.mesh.position.x += r.vx;
            r.mesh.position.y += r.vy;
            r.mesh.position.z += r.vz;
            r.vy *= 0.985; // 减速

            // 尾迹
            const trailGeo = new THREE.SphereGeometry(0.08, 4, 4);
            const trailMat = new THREE.MeshBasicMaterial({
                color: 0xffaa00,
                transparent: true,
                opacity: 0.8
            });
            const trail = new THREE.Mesh(trailGeo, trailMat);
            trail.position.copy(r.mesh.position);
            trail.position.y -= 0.3;
            scene.add(trail);
            r.trail.push({ mesh: trail, life: 1 });

            // 更新尾迹
            for (let j = r.trail.length - 1; j >= 0; j--) {
                r.trail[j].life -= 0.03;
                r.trail[j].mesh.material.opacity = r.trail[j].life;
                if (r.trail[j].life <= 0) {
                    scene.remove(r.trail[j].mesh);
                    r.trail.splice(j, 1);
                }
            }

            // 到达最高点爆炸
            if (r.vy < 0.05 || r.mesh.position.y >= r.targetY) {
                r.exploded = true;
                explodeFirework(r.mesh.position.x, r.mesh.position.y, r.mesh.position.z, r.color);
                scene.remove(r.mesh);
                r.trail.forEach(t => scene.remove(t.mesh));
                rockets.splice(i, 1);
            }
        }
    }
}

function explodeFirework(x, y, z, color) {
    audio.playExplosion();

    const particleCount = 80;
    const particles = [];

    for (let i = 0; i < particleCount; i++) {
        const geo = new THREE.SphereGeometry(0.06 + Math.random() * 0.06, 4, 4);
        const mat = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: 1
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const speed = Math.random() * 0.35 + 0.1;

        particles.push({
            mesh: mesh,
            vx: Math.sin(phi) * Math.cos(theta) * speed,
            vy: Math.cos(phi) * speed,
            vz: Math.sin(phi) * Math.sin(theta) * speed,
            life: 1,
            decay: Math.random() * 0.008 + 0.005,
            gravity: 0.003
        });
        scene.add(mesh);
    }

    // 闪光
    const flash = new THREE.PointLight(color, 2, 30);
    flash.position.set(x, y, z);
    scene.add(flash);

    explosions.push({
        particles: particles,
        flash: flash,
        flashLife: 1
    });
}

function updateExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        let alive = false;

        // 更新闪光
        if (exp.flashLife > 0) {
            exp.flashLife -= 0.05;
            exp.flash.intensity = exp.flashLife * 2;
            if (exp.flashLife <= 0) {
                scene.remove(exp.flash);
            }
        }

        for (let j = exp.particles.length - 1; j >= 0; j--) {
            const p = exp.particles[j];
            p.mesh.position.x += p.vx;
            p.mesh.position.y += p.vy;
            p.mesh.position.z += p.vz;
            p.vy -= p.gravity;
            p.vx *= 0.995;
            p.vz *= 0.995;
            p.life -= p.decay;
            p.mesh.material.opacity = Math.max(0, p.life);

            if (p.life > 0) {
                alive = true;
            } else {
                scene.remove(p.mesh);
                exp.particles.splice(j, 1);
            }
        }

        if (!alive) {
            explosions.splice(i, 1);
        }
    }
}

// ==================== 真实光柱（体积光效果）====================
let lightPillar = null;
let pillarLight = null;

function createRealLightPillar() {
    // 多层圆柱体模拟体积光
    const group = new THREE.Group();

    for (let i = 0; i < 5; i++) {
        const radius = 0.5 + i * 0.4;
        const height = 30 + i * 2;
        const geo = new THREE.CylinderGeometry(radius * 0.3, radius, height, 16, 1, true);
        const mat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(0xffd700).lerp(new THREE.Color(0xffaa00), i / 5),
            transparent: true,
            opacity: 0.06 - i * 0.01,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = height / 2 - 8;
        group.add(mesh);
    }

    // 底部光晕
    const glowGeo = new THREE.RingGeometry(0.5, 4, 32);
    const glowMat = new THREE.MeshBasicMaterial({
        color: 0xffd700,
        transparent: true,
        opacity: 0.15,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.rotation.x = -Math.PI / 2;
    glow.position.y = -8;
    group.add(glow);

    // 顶部光点
    const topGlow = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 16),
        new THREE.MeshBasicMaterial({
            color: 0xffffaa,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );
    topGlow.position.y = 22;
    group.add(topGlow);

    // 真实点光源
    pillarLight = new THREE.PointLight(0xffd700, 1.5, 50);
    pillarLight.position.set(0, 5, 0);
    scene.add(pillarLight);

    lightPillar = group;
    scene.add(group);

    // 淡入
    group.children.forEach(c => {
        c.material.opacity = 0;
    });

    let op = 0;
    const fadeIn = () => {
        op += 0.005;
        group.children.forEach((c, i) => {
            if (c.material.opacity !== undefined) {
                c.material.opacity = Math.min((0.06 - i * 0.01) || 0.15, op * (1 - i * 0.15));
            }
        });
        pillarLight.intensity = Math.min(1.5, op * 3);
        if (op < 1) requestAnimationFrame(fadeIn);
    };
    fadeIn();
}

// ==================== 祝福文字（更多内容）====================
let blessingGroup = null;

function createTextTexture(text, fontSize, color, glow) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const w = 1024;
    const h = 128;
    canvas.width = w;
    canvas.height = h;

    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, w, h);

    ctx.font = `bold ${fontSize}px Microsoft YaHei, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 40;
    }
    ctx.fillStyle = color;
    ctx.fillText(text, w / 2, h / 2);

    const texture = new THREE.CanvasTexture(canvas);
    texture.minFilter = THREE.LinearFilter;
    return texture;
}

function showBlessingText() {
    if (blessingGroup) return;
    blessingGroup = new THREE.Group();

    // 主标题
    const mainTex = createTextTexture('旁白，生日快乐', 55, '#ffd700', true);
    const mainMat = new THREE.SpriteMaterial({
        map: mainTex,
        transparent: true,
        opacity: 0,
        depthTest: false
    });
    const mainSprite = new THREE.Sprite(mainMat);
    mainSprite.scale.set(20, 2.5, 1);
    mainSprite.position.set(0, 8, 0);
    blessingGroup.add(mainSprite);

    // 副标题
    const subTex = createTextTexture('愿你的每一天都闪闪发光', 32, '#ffaa55', false);
    const subMat = new THREE.SpriteMaterial({
        map: subTex,
        transparent: true,
        opacity: 0,
        depthTest: false
    });
    const subSprite = new THREE.Sprite(subMat);
    subSprite.scale.set(14, 1.75, 1);
    subSprite.position.set(0, 5.5, 0);
    blessingGroup.add(subSprite);

    // 环绕祝福（8条，更多内容）
    const texts = [
        '最好的朋友',
        '生日快乐',
        '心想事成',
        '友谊长存',
        '前程似锦',
        '笑口常开',
        '万事顺遂',
        '来日方长'
    ];
    texts.forEach((text, i) => {
        const tex = createTextTexture(text, 26, '#ffd700', false);
        const mat = new THREE.SpriteMaterial({
            map: tex,
            transparent: true,
            opacity: 0,
            depthTest: false
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(6, 1.5, 1);
        const angle = (i / texts.length) * Math.PI * 2;
        sprite.userData = { 
            angle, 
            radius: 16, 
            speed: 0.15, 
            yBase: 1 + (i % 3) * 2 
        };
        sprite.position.set(
            Math.cos(angle) * 16,
            sprite.userData.yBase,
            Math.sin(angle) * 16
        );
        blessingGroup.add(sprite);
    });

    scene.add(blessingGroup);

    // 淡入
    let op = 0;
    const fadeIn = () => {
        op += 0.012;
        blessingGroup.children.forEach(c => {
            c.material.opacity = Math.min(1, op);
        });
        if (op < 1) requestAnimationFrame(fadeIn);
    };
    fadeIn();
}

// ==================== 交互 ====================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isDragging = false;
let previousMouse = { x: 0, y: 0 };
let cameraAngle = { theta: 0, phi: Math.PI / 2.5 };
let openedCount = 0;
let allOpened = false;

function getEventPos(e) {
    if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
}

function onPointerMove(e) {
    const pos = getEventPos(e);
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((pos.x - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((pos.y - rect.top) / rect.height) * 2 + 1;

    if (isDragging) {
        const dx = pos.x - previousMouse.x;
        const dy = pos.y - previousMouse.y;
        cameraAngle.theta -= dx * 0.005;
        cameraAngle.phi = Math.max(0.3, Math.min(Math.PI - 0.3, cameraAngle.phi - dy * 0.005));
        updateCamera();
    }
    previousMouse.x = pos.x;
    previousMouse.y = pos.y;

    raycaster.setFromCamera(mouse, camera);
    let hovering = false;
    for (let group of envelopes) {
        const intersects = raycaster.intersectObjects(group.children, true);
        if (intersects.length > 0 && !group.userData.data.opened) {
            hovering = true;
            break;
        }
    }
    renderer.domElement.style.cursor = hovering ? 'pointer' : (isDragging ? 'grabbing' : 'grab');
}

function onPointerDown(e) {
    const pos = getEventPos(e);
    isDragging = true;
    previousMouse.x = pos.x;
    previousMouse.y = pos.y;

    raycaster.setFromCamera(mouse, camera);
    for (let group of envelopes) {
        const intersects = raycaster.intersectObjects(group.children, true);
        if (intersects.length > 0 && !group.userData.data.opened) {
            openEnvelope(group);
            isDragging = false;
            break;
        }
    }
}

function onPointerUp() {
    isDragging = false;
}

function updateCamera() {
    const r = 30;
    camera.position.x = r * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
    camera.position.y = r * Math.cos(cameraAngle.phi);
    camera.position.z = r * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
    camera.lookAt(0, 0, 0);
}

function openEnvelope(group) {
    audio.init();
    audio.playOpen();

    group.userData.data.opened = true;
    openedCount++;
    document.getElementById('dot-' + group.userData.index).classList.add('opened');

    const flap = group.userData.flap;
    let rot = 0;
    const openAnim = () => {
        rot += 0.06;
        flap.rotation.x = -rot;
        if (rot < Math.PI) requestAnimationFrame(openAnim);
    };
    openAnim();

    for (let i = 0; i < 15; i++) {
        const geo = new THREE.PlaneGeometry(0.2, 0.2);
        const mat = new THREE.MeshBasicMaterial({
            color: [0xffd700, 0xff6b6b, 0x4ecdc4, 0xff69b4][Math.floor(Math.random() * 4)],
            side: THREE.DoubleSide,
            transparent: true
        });
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(group.position);
        p.userData = {
            vx: (Math.random() - 0.5) * 0.2,
            vy: Math.random() * 0.2 + 0.05,
            vz: (Math.random() - 0.5) * 0.2,
            rotX: Math.random() * 0.1,
            rotY: Math.random() * 0.1,
            life: 1
        };
        scene.add(p);

        const animateP = () => {
            p.position.x += p.userData.vx;
            p.position.y += p.userData.vy;
            p.position.z += p.userData.vz;
            p.rotation.x += p.userData.rotX;
            p.rotation.y += p.userData.rotY;
            p.userData.vy -= 0.004;
            p.userData.life -= 0.015;
            p.material.opacity = p.userData.life;
            if (p.userData.life > 0) requestAnimationFrame(animateP);
            else scene.remove(p);
        };
        animateP();
    }

    setTimeout(() => showLetter(group.userData.data.text), 400);

    if (openedCount >= 3 && !allOpened) {
        allOpened = true;
        setTimeout(() => celebrate(), 1500);
    }
}

function showLetter(text) {
    const overlay = document.getElementById('letter-overlay');
    const paper = document.getElementById('letter-paper');
    const textEl = document.getElementById('letter-text');

    textEl.innerHTML = '';
    const sentences = text.split('。').filter(l => l.trim());
    sentences.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'line';
        div.textContent = s + (i < sentences.length - 1 ? '。' : '');
        textEl.appendChild(div);
    });

    overlay.classList.add('active');
    setTimeout(() => paper.classList.add('show'), 50);

    const lines = textEl.querySelectorAll('.line');
    lines.forEach((line, i) => {
        setTimeout(() => line.classList.add('show'), i * 500 + 300);
    });
}

function closeLetter() {
    const overlay = document.getElementById('letter-overlay');
    const paper = document.getElementById('letter-paper');
    paper.classList.remove('show');
    setTimeout(() => overlay.classList.remove('active'), 300);
}

document.getElementById('letter-overlay').addEventListener('click', closeLetter);
document.querySelector('.letter-close').addEventListener('click', (e) => {
    e.stopPropagation();
    closeLetter();
});

function celebrate() {
    document.getElementById('hint').textContent = '所有祝福已收集完成！';

    createRealLightPillar();

    // 真实烟花：上升后爆炸
    let count = 0;
    const interval = setInterval(() => {
        launchRealFirework();
        count++;
        if (count >= 20) clearInterval(interval);
    }, 600);

    setTimeout(() => audio.playBirthdaySong(), 800);
    setTimeout(() => showBlessingText(), 2500);
    setTimeout(() => {
        document.getElementById('hint').style.opacity = 0;
    }, 8000);
}

// 事件绑定
const canvas = renderer.domElement;
canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', (e) => { onPointerDown(e); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
canvas.addEventListener('touchend', onPointerUp);

// ==================== 动画循环 ====================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    // 星空
    stars.rotation.y = time * 0.015;
    starMat.uniforms.time.value = time;

    // 萤火虫
    fireflies.forEach(f => {
        f.position.x += f.userData.vx + Math.sin(time * 0.5 + f.userData.phase) * 0.005;
        f.position.y = f.userData.baseY + Math.sin(time * 1.5 + f.userData.phase) * 0.8;
        f.position.z += f.userData.vz + Math.cos(time * 0.4 + f.userData.phase) * 0.005;
        f.material.opacity = 0.4 + Math.sin(time * 3 + f.userData.phase) * 0.4;

        if (Math.abs(f.position.x) > 25) f.userData.vx *= -1;
        if (Math.abs(f.position.z) > 25) f.userData.vz *= -1;
    });

    // 信封浮动
    envelopes.forEach((group, i) => {
        if (!group.userData.data.opened) {
            group.position.y = group.userData.originalY + Math.sin(time * 1.2 + i * 2) * 0.4;
            group.rotation.y = Math.sin(time * 0.4 + i) * 0.08;
        }
        group.userData.glow.material.opacity = 0.02 + Math.sin(time * 2 + i) * 0.02;
    });

    // 湖面波动
    const lakePos = lake.geometry.attributes.position.array;
    for (let i = 0; i < lakePos.length; i += 3) {
        const x = lakePos[i];
        const z = lakePos[i + 2];
        lakePos[i + 1] = Math.sin(x * 0.08 + time) * 0.4 + Math.cos(z * 0.08 + time * 0.7) * 0.3;
    }
    lake.geometry.attributes.position.needsUpdate = true;

    // 光柱
    if (lightPillar) {
        lightPillar.rotation.y = time * 0.3;
        lightPillar.children.forEach((c, i) => {
            if (c.material.opacity !== undefined) {
                const baseOp = (0.06 - i * 0.01) || 0.15;
                c.material.opacity = baseOp + Math.sin(time * 2 + i) * baseOp * 0.3;
            }
        });
        if (pillarLight) {
            pillarLight.intensity = 1.5 + Math.sin(time * 3) * 0.3;
        }
    }

    // 祝福文字环绕
    if (blessingGroup) {
        blessingGroup.children.forEach((child, i) => {
            if (i > 1 && child.userData.angle !== undefined) {
                child.userData.angle += child.userData.speed * 0.008;
                child.position.x = Math.cos(child.userData.angle) * child.userData.radius;
                child.position.z = Math.sin(child.userData.angle) * child.userData.radius;
                child.position.y = child.userData.yBase + Math.sin(time + i) * 0.3;
            }
        });
    }

    // 流星
    if (Math.random() < 0.003) {
        const meteor = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 6, 6),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        meteor.position.set(
            50 + Math.random() * 50,
            40 + Math.random() * 20,
            (Math.random() - 0.5) * 50
        );
        scene.add(meteor);

        const animateMeteor = () => {
            meteor.position.x -= 1.5;
            meteor.position.y -= 0.8;
            meteor.position.z -= 0.3;
            if (meteor.position.y > -20) {
                requestAnimationFrame(animateMeteor);
            } else {
                scene.remove(meteor);
            }
        };
        animateMeteor();
    }

    // 更新烟花
    updateRockets();
    updateExplosions();

    renderer.render(scene, camera);
}

// 窗口调整
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 启动
updateCamera();
document.getElementById('loading').style.opacity = 0;
setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
}, 1000);

animate();
</script>
